 */const Ud=$("x",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);function U0({navigate:n}){const[s,o]=G.useState("teen"),[c,d]=G.useState(0),[h,m]=G.useState(!1),[p,v]=G.useState(""),[x,b]=G.useState(!1),[y,N]=G.useState(""),[w,k]=G.useState([{sender:"agent",text:l.jsxs(l.Fragment,{children:["Oi! Sou o seu Co-Piloto e Agente Especial do ECA Digital ",l.jsx(Rr,{className:"w-[1em] h-[1em] inline-block"}),". Eu trago as traduções oficiais e didáticas de todos os artigos da Lei 15.211 feitas por especialistas de Mídia e Juventude. Escolha uma das perguntas abaixo ou digite sua dúvida."]})}]),B=[{id:1,chapter:"Capítulo I & II: Direitos Fundamentais",articles:"Artigos 1º ao 5º",icon:l.jsx(kt,{}),color:"var(--yellow-light)",textcolor:"var(--text)",content:{child:{title:"A Internet como um Parquinho Seguro",desc:"Assim como no parquinho você tem regras para brincar sem se machucar, a Lei 15.211 cria regras para a internet. Ela obriga os criadores de jogos e aplicativos a construírem lugares virtuais totalmente pensados para a sua segurança, proibindo qualquer tipo de conteúdo ou ferramenta que possa te enganar, assustar ou expor a pessoas perigosas."},teen:{title:"Cidadania e Seus Direitos Online",desc:"Você tem o direito de navegar com autonomia, sem ser manipulado por empresas de tecnologia. A lei garante que as redes sociais não podem priorizar o lucro acima da sua saúde mental, obrigando as plataformas a desenvolverem um 'Design Seguro' que não estimule vícios, transtornos de autoimagem ou isolamento social."},adult:{title:"Princípio do Melhor Interesse",desc:"Segundo os Artigos 1º ao 5º, toda plataforma digital com acesso de menores deve ser desenvolvida sob o princípio da Proteção Integral e do Melhor Interesse. Isso exige a adoção do 'Safety by Design' (Segurança desde a Concepção), priorizando o bem-estar psicológico e físico frente aos interesses comerciais da plataforma."}}},{id:2,chapter:"Capítulo III: Prevenção de Perigos",articles:"Artigo 6º",icon:l.jsx(D0,{}),color:"var(--red)",textcolor:"var(--surface)",content:{child:{title:"O Escudo Contra Perigos",desc:"A lei funciona como um escudo inteligente. Ela proíbe que aplicativos mostrem ou recomendem vídeos e imagens que ensinem a machucar a si mesmo, incentivem violência ou mostrem jogos de azar de adultos. Se algo for perigoso para sua idade, tem que ser bloqueado."},teen:{title:"Bloqueio de Conteúdos Nocivos",desc:"O algoritmo não pode mais empurrar 'lixo tóxico' para você apenas para prender sua atenção. A lei proíbe expressamente a recomendação e exibição de conteúdos que promovam automutilação, distúrbios alimentares, bullying, uso de drogas ou qualquer atividade criminosa."},adult:{title:"Dever de Mitigação de Riscos (Art. 6º)",desc:"As Big Techs possuem obrigação solidária e preventiva de bloquear a disseminação e a amplificação algorítmica de conteúdos ilícitos ou de risco, como exploração infantil, incitação a crimes e publicidade predatória, não podendo alegar desconhecimento do algoritmo."}}},{id:3,chapter:"Capítulo IV & XV: Privacidade por Padrão",articles:"Artigos 7º, 8º, 38 e 39",icon:l.jsx(b0,{}),color:"var(--green)",textcolor:"var(--text)",content:{child:{title:"Seus Segredos Protegidos",desc:"Nenhum aplicativo pode te 'espionar'. A lei diz que eles não podem ligar sua câmera, ver suas conversas ou saber o endereço de onde você mora sem que seus pais autorizem primeiro. As configurações de segurança mais fortes já vêm ativadas."},teen:{title:"Sua Vida Não é um Produto",desc:"Chega de ter aplicativos mapeando cada passo seu. A 'Privacidade Máxima' passa a ser o padrão obrigatório. Nenhuma empresa pode coletar secretamente sua geolocalização ou histórico para montar um perfil comportamental seu e vender essas informações."},adult:{title:"Privacy and Security by Default",desc:"As configurações mais restritivas de privacidade devem ser implementadas por padrão (Art. 7º). É absolutamente proibido coletar, processar e monetizar metadados ou geolocalização de crianças e adolescentes de forma opaca ou sem consentimento explícito dos responsáveis."}}},{id:4,chapter:"Capítulo V: Verificação de Idade",articles:"Artigos 9º a 11 e 13 a 15",icon:l.jsx(Ld,{}),color:"var(--gray-400)",textcolor:"var(--text)",content:{child:{title:"O Porteiro Digital",desc:"Alguns lugares da internet são só para adultos. Agora, não vai mais dar para só clicar no botão dizendo 'sou maior de idade'. Haverá um porteiro inteligente verificando se o aplicativo ou jogo é realmente seguro e feito para a sua idade."},teen:{title:"Verificação Real sem Perder a Privacidade",desc:"Para impedir que adultos criem perfis falsos tentando se passar por adolescentes e conversar com você, as redes terão que verificar a idade de verdade. Mas calma: eles só vão comprovar sua faixa etária, não guardar seus documentos (via Zero-Knowledge Proof)."},adult:{title:"Aferição de Idade Idônea",desc:"A autodeclaração ('tenho mais de 18') perde a validade. As plataformas devem adotar mecanismos rigorosos e neutros de 'Age Assurance' (Garantia de Idade), garantindo a proteção de dados (não retendo documentos de identidade) para segregar espaços infantis e adultos."}}},{id:5,chapter:"Capítulo VI & VII: Supervisão e Consentimento",articles:"Artigos 12, 16, 17 e 18",icon:l.jsx(Jt,{}),color:"var(--accent-light)",textcolor:"var(--text)",content:{child:{title:"Apoio da Família",desc:"Para compras dentro de jogos ou para acessar lugares com estranhos, você vai precisar do apoio da sua família. O aplicativo avisa o celular dos seus pais e eles podem te ajudar a escolher o que é seguro instalar e com quem você pode conversar."},teen:{title:"Controle Contra o Vício",desc:"Você deve ser o dono do seu próprio tempo. A lei exige ferramentas fáceis e acessíveis para que você possa desligar recursos viciantes, como a reprodução automática de vídeos (autoplay) e o 'scroll infinito' (rolagem de tela que nunca acaba)."},adult:{title:"Governança e Consentimento Parental",desc:"Plataformas são obrigadas a fornecer painéis de controle em linguagem acessível (português), permitindo à família gerenciar o tempo de tela do menor, aprovar contatos de terceiros e auditar as permissões de compartilhamento de dados ativas (Art. 16)."}}},{id:6,chapter:"Capítulo VI: Monitoramento vs. Espionagem",articles:"Artigo 19",icon:l.jsx(ln,{}),color:"var(--yellow)",textcolor:"var(--text)",content:{child:{title:"Avisos de Segurança",desc:"Mesmo que sua família ou escola usem um aplicativo para saber onde você está (para sua segurança na rua, por exemplo), o seu celular sempre te mostrará um aviso claro dizendo que você está sendo cuidado. Ninguém pode te monitorar escondido."},teen:{title:"Transparência Não é Espionagem",desc:"Ferramentas de controle parental visam sua segurança física e digital, mas a espionagem invisível (stalkerware) foi proibida. O Artigo 19 garante que você veja uma notificação constante na tela se houver softwares rastreando sua localização."},adult:{title:"Transparência no Monitoramento (Art. 19)",desc:"Software de controle parental ou corporativo que monitora a localização de menores é legal, mas é proibida a operação furtiva. O dispositivo deve manter notificação constante, clara e inteligível ao menor de que o monitoramento está ativo."}}},{id:7,chapter:"Capítulo VII & VIII: Fim do Cassino",articles:"Artigos 20 e 21",icon:l.jsx(nn,{}),color:"var(--red-light)",textcolor:"var(--text)",content:{child:{title:"Fim das Caixas Surpresa Pagas",desc:"Sabe quando você compra uma caixa mágica no jogo e ela só te dá itens ruins repetidos? A lei proibiu as 'Loot Boxes' que custam dinheiro de verdade. Agora, se for pagar por um item, o jogo tem que mostrar exatamente o que você está comprando."},teen:{title:"Fim da Manipulação e do Pay-to-Win",desc:"Adeus aos cassinos virtuais disfarçados de joguinhos inocentes. A lei proíbe apostas em jogos infanto-juvenis, roletas para ganhar itens e o uso de 'dinheiro virtual' confuso que tenta esconder de você quanto as coisas custam de verdade em Reais (R$)."},adult:{title:"Vedação a Mecânicas de Cassino",desc:"Proibição expressa de comercialização e oferta de 'Loot Boxes' pagas, roletas, simulações de jogos de azar e outras mecânicas de monetização predatória que induzam menores a gastos impulsivos sob efeito psicológico similar a apostas."}}},{id:8,chapter:"Capítulo VIII, IX & XI: Fim da Publicidade Espiã",articles:"Artigos 22 a 26",icon:l.jsx(Vs,{}),color:"var(--purple)",textcolor:"#fff",content:{child:{title:"Propaganda Limpa",desc:"Os robôs da internet não podem tentar adivinhar se você está triste para te mostrar propaganda de doces, nem usar youtubers famosos para te convencer a comprar coisas perigosas escondido. Toda propaganda tem que ser honesta."},teen:{title:"Fim do Marketing Manipulador",desc:"É proibido que empresas juntem seus dados de navegação, histórico e reações para criar propagandas direcionadas que manipulam seu estado emocional ('Microtargeting'). A publicidade para o seu público deve ser genérica e identificada claramente."},adult:{title:"Proibição de Perfilamento Comportamental",desc:"O ECA Digital bane a coleta massiva e a inferência algorítmica de dados (incluindo estados emocionais momentâneos) para a criação de perfis de marketing e publicidade comportamental direcionada (Microtargeting) visando o público infanto-juvenil."}}},{id:9,chapter:"Capítulo X, XI & XIII: Dever de Cuidado",articles:"Artigos 27 a 33",icon:l.jsx(ia,{}),color:"var(--red-light)",textcolor:"var(--text)",content:{child:{title:"Denúncias Rápidas e Eficazes",desc:"Se alguém for maldoso com você, te ofender ou postar algo que não deveria, as redes sociais agora são obrigadas a ter um botão de ajuda fácil. E a melhor parte: eles precisam apagar a coisa ruim rápido, protegendo você."},teen:{title:"Remoção Ágil e Dever Legal",desc:"Se você denunciar um episódio de cyberbullying, assédio ou vazamento de imagens, a rede social tem obrigação legal ('Duty of Care') de remover o material rapidamente. Eles não podem mais alegar que 'não são responsáveis' pelo que os usuários postam."},adult:{title:"Dever de Cuidado (Duty of Care)",desc:"Consolida a responsabilização civil das plataformas por omissão. Estabelece a exigência de canais de denúncia ágeis e acessíveis, obrigando a moderação e remoção célere de conteúdos ilícitos contra menores, além da auditoria contínua de riscos."}}},{id:10,chapter:"Capítulo XIV ao XVI: Fiscalização e Multas",articles:"Artigos 34 a 37 e 41",icon:l.jsx(Aa,{}),color:"var(--red)",textcolor:"var(--surface)",content:{child:{title:"Regras que Valem de Verdade",desc:"Não adianta ter regras se as empresas gigantes não obedecerem. O ECA Digital criou castigos e multas enormes. Se um aplicativo não proteger você, ele pode até ser tirado do ar no Brasil!"},teen:{title:"Multas Pesadas para as Big Techs",desc:"A lei não é só no papel. Se o Instagram, TikTok ou qualquer rede descumprir as normas e expor os jovens a riscos, eles sofrerão multas pesadíssimas e sanções para forçá-los a mudar o modelo de negócios."},adult:{title:"Sanções e Estrutura Regulatória",desc:"O não cumprimento resulta em multas administrativas de até R$ 50 milhões por infração (ou % do faturamento), obrigações de fazer (mudança de código/algoritmo) e, em casos extremos, suspensão temporária das atividades no país (Art. 34 a 37)."}}}],U=()=>{if(y.trim()==="")return;const D=y.toLowerCase();let H="";D.includes("loot box")||D.includes("caixa")||D.includes("jogo de azar")||D.includes("baú")?H=l.jsxs(l.Fragment,{children:[l.jsx(nn,{className:"w-[1em] h-[1em] inline-block"})," Art. 20 e 21: O ECA Digital baniu Loot Boxes (caixas de sorte) pagas para menores."]}):D.includes("dark patterns")||D.includes("truque")||D.includes("manipulador")||D.includes("timer")?H=l.jsxs(l.Fragment,{children:[l.jsx(Ls,{className:"w-[1em] h-[1em] inline-block"})," Art. 6º, V: É ilegal usar design enganoso para prender a atenção ou forçar assinaturas."]}):D.includes("dados")||D
