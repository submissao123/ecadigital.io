"A lei proíbe expressamente que plataformas mostrem ou recomendem conteúdos que incentivem automutilação, distúrbios alimentares, bullying ou uso de drogas. O algoritmo não pode empurrar lixo tóxico para você."},adult:{title:"Dever de Mitigação de Riscos (Art. 6º)",desc:"As Big Techs têm a obrigação legal e solidária de bloquear ativamente a disseminação e a recomendação algorítmica de conteúdos que envolvam violência, exploração, incitação a crimes ou publicidade predatória."}}},{id:3,chapter:"Capítulo IV & XV: Privacidade por Padrão",articles:"Artigos 7º, 8º, 38 e 39",icon:"🤐",color:"#55EFC4",textColor:"#2D3436",content:{child:{title:"A Sua Capa de Invisibilidade",desc:"Nenhum aplicativo pode te espionar! Eles não podem saber com quem você conversa, não podem ver suas fotos nem saber onde você mora sem pedir a permissão dos seus pais primeiro. Você tem direito à sua privacidade."},teen:{title:"Sua Vida Não é um Produto",desc:"Chega de ter o celular 'ouvindo' e rastreando você. A lei exige que a 'Privacidade Máxima' venha ligada por padrão. Nenhuma empresa pode coletar sua geolocalização ou histórico de navegação para montar um perfil secreto seu."},adult:{title:"Privacy and Security by Default",desc:"As configurações mais restritivas de privacidade devem ser ativadas por padrão (Art. 7º). É absolutamente proibido coletar, processar e monetizar metadados ou geolocalização de crianças e adolescentes de forma opaca."}}},{id:4,chapter:"Capítulo V: Verificação de Idade",articles:"Artigos 9º a 11 e 13 a 15",icon:"🆔",color:"#B2BEC3",textColor:"#2D3436",content:{child:{title:"O Porteiro de Idade",desc:"Sabe quando um brinquedo diz 'para maiores de 10 anos'? A internet também terá um porteiro inteligente. Não vai mais dar para só clicar em 'nasci em 1900' para entrar. Ele vai checar de verdade se aquele aplicativo é seguro para a sua idade."},teen:{title:"Verificação Real e Privacidade",desc:"Para acabar com perfis fakes de adultos tentando falar com menores, os aplicativos terão que checar a idade de verdade (usando métodos seguros). Mas fique tranquilo: eles só vão saber sua idade, não quem você é (Zero-Knowledge Proof)."},adult:{title:"Aferição de Idade Idônea",desc:"A mera autodeclaração ('tenho mais de 18') não é mais válida. As plataformas devem adotar mecanismos de 'Age Assurance' rigorosos, garantindo a privacidade e não retendo os dados de identidade (Art. 9º)."}}},{id:5,chapter:"Capítulo VI & VII: Supervisão e Consentimento",articles:"Artigos 12, 16, 17 e 18",icon:"👨‍👩‍👧",color:"#74B9FF",textColor:"#2D3436",content:{child:{title:"Combinado com a Família",desc:"Sabe quando você precisa pedir para os seus pais para comprar um brinquedo? Na internet vai ser igual. O aplicativo vai mandar um aviso para o celular deles para que eles possam deixar (ou não) você instalar um jogo ou falar com estranhos."},teen:{title:"Controle Contra o Vício",desc:"Ferramentas para impedir que o aplicativo engula seu tempo. A lei obriga as plataformas a oferecerem botões fáceis para desligar o 'scroll infinito' e a reprodução automática de vídeos, devolvendo a você o controle do seu tempo."},adult:{title:"Governança e Consentimento Parental",desc:"As plataformas devem fornecer painéis de controle em linguagem acessível (português), permitindo o gerenciamento ativo do tempo de tela, a aprovação de contatos e a auditoria das permissões de dados (Art. 16)."}}},{id:6,chapter:"Capítulo VI: Monitoramento vs. Espionagem",articles:"Artigo 19",icon:"🕵️",color:"#F1C40F",textColor:"#2D3436",content:{child:{title:"Aviso de Cuidado",desc:"Se os seus pais ou a escola instalarem algo para ver onde você está (para sua segurança), o celular é obrigado a te mostrar um aviso grande e claro. Ninguém pode te monitorar escondido."},teen:{title:"Transparência Não é Espionagem",desc:"Ferramentas de controle parental são legais, mas a espionagem invisível não. O Artigo 19 garante que você seja notificado permanentemente na tela se algum software estiver rastreando sua localização ou suas mensagens."},adult:{title:"Transparência no Monitoramento (Art. 19)",desc:"Software de controle parental ou corporativo que monitora localização ou atividades de menores é legal, mas deve manter notificação constante, clara e inteligível ao menor. A espionagem furtiva ('stalkerware') é banida."}}},{id:7,chapter:"Capítulo VII & VIII: Fim do Cassino",articles:"Artigos 20 e 21",icon:"🎮",color:"#FAB1A0",textColor:"#2D3436",content:{child:{title:"Sem Caixas Trapaceiras",desc:"Sabe quando você compra uma caixa surpresa no jogo esperando uma espada mágica e ganha uma meia velha? O ECA Digital proibiu as 'Loot Boxes' pagas para crianças. Você só paga se souber exatamente o que está comprando."},teen:{title:"Fim da Manipulação e do Pay-to-Win",desc:"Adeus aos cassinos disfarçados de jogos. A lei bane mecânicas de apostas, caixas de recompensa aleatórias (Loot Boxes) e moedas virtuais confusas. Os preços devem ser mostrados em Reais (R$) para você não ser enganado."},adult:{title:"Vedação a Mecânicas de Cassino",desc:"Proibição expressa de comercialização e oferta de 'Loot Boxes' (caixas de recompensa randômicas), jogos de azar, apostas e mecanismos de monetização predatória ou confusa voltados ao público infanto-juvenil."}}},{id:8,chapter:"Capítulo VIII, IX & XI: Fim da Publicidade Espiã",articles:"Artigos 22 a 26",icon:"📢",color:"#A29BFE",textColor:"#2D3436",content:{child:{title:"Propaganda Justa",desc:"Robôs da internet não podem mais tentar ler se você está triste ou feliz para tentar te vender brinquedos ou doces nessa hora. A publicidade precisa ser honesta, clara e não pode te assustar."},teen:{title:"Chega de Marketing Invasivo",desc:"A lei proíbe as empresas de juntarem milhares de dados sobre você (curtidas, pesquisas) para criar propagandas super direcionadas que manipulam suas emoções. Anunciar para jovens deve ser ético e genérico."},adult:{title:"Proibição de Perfilamento Comportamental",desc:"O ECA Digital bane a coleta, cruzamento e inferência de dados (incluindo estados emocionais) para a criação de perfilamento de marketing (Microtargeting) e publicidade comportamental predatória (Art. 22 e 26)."}}},{id:9,chapter:"Capítulo X, XI & XIII: Dever de Cuidado",articles:"Artigos 27 a 33",icon:"🚨",color:"#FD79A8",textColor:"#FFFFFF",content:{child:{title:"O Botão de Ajuda Mais Rápido",desc:"Se alguém for malvado com você ou postar algo feio, os aplicativos agora são obrigados a ter um botão de ajuda muito fácil de achar. E eles precisam apagar a coisa ruim bem rápido, sem enrolação!"},teen:{title:"Remoção Rápida e Responsabilidade",desc:"Se você denunciar assédio, imagens íntimas vazadas ou bullying, as redes sociais não podem ignorar. Elas têm a obrigação legal (Duty of Care) de agir rápido para remover o conteúdo, sob pena de serem punidas."},adult:{title:"Dever de Cuidado (Duty of Care)",desc:"Institui a responsabilização das plataformas por omissão. Cria canais de denúncia prioritários e obriga a remoção célere de conteúdos ilícitos (como CSAM, cyberbullying e assédio), exigindo publicação regular de auditorias e relatórios de risco."}}},{id:10,chapter:"Capítulo XIV ao XVI: Fiscalização e Multas",articles:"Artigos 34 a 37 e 41",icon:"⚖️",color:"#D63031",textColor:"#FFFFFF",content:{child:{title:"Regras que Valem de Verdade",desc:"Não adianta ter regras se as empresas gigantes não obedecerem. O ECA Digital criou castigos e multas enormes. Se um aplicativo não proteger você, ele pode até ser tirado do ar no Brasil!"},teen:{title:"Multas Pesadas para as Big Techs",desc:"A lei não é só no papel. Se o Instagram, TikTok ou qualquer rede descumprir as normas e expor os jovens a riscos, eles sofrerão multas pesadíssimas e sanções para forçá-los a mudar o modelo de negócios."},adult:{title:"Sanções e Estrutura Regulatória",desc:"O não cumprimento resulta em multas administrativas de até R$ 50 milhões por infração (ou % do faturamento), obrigações de fazer (mudança de código/algoritmo) e, em casos extremos, suspensão temporária das atividades no país (Art. 34 a 37)."}}}],Ue=()=>{if(j.trim()==="")return;const q=j.toLowerCase();let we="";q.includes("loot box")||q.includes("caixa")||q.includes("jogo de azar")||q.includes("baú")?we="🎮 Art. 20 e 21: O ECA Digital baniu Loot Boxes (caixas de sorte) pagas para menores.":q.includes("dark patterns")||q.includes("truque")||q.includes("manipulador")||q.includes("timer")?we="🕵️ Art. 6º, V: É ilegal usar design enganoso para prender a atenção ou forçar assinaturas.":q.includes("dados")||q.includes("privacidade")||q.includes("cookie")||q.includes("foto")||q.includes("rastrear")?we="🤐 Art. 7º e 12: A privacidade deve ser padrão de fábrica. É proibido monitorar ou rastrear para fins comerciais.":q.includes("pais")||q.includes("mãe")||q.includes("pai")||q.includes("responsável")||q.includes("supervisão")?we="👨‍👩‍👧 Art. 16 a 18: Seus pais podem supervisionar tempo de tela, mas sem espionagem oculta.":q.includes("idade")||q.includes("idade minima")||q.includes("verificação")?we="🆔 Art. 9º a 11: Plataformas precisam de validação confiável de idade, proibindo perfis fakes.":q.includes("propaganda")||q.includes("anúncio")||q.includes("perfilamento")||q.includes("marketing")?we="📢 Art. 22: É proibido segmentar propaganda usando análise emocional de menores.":q.includes("multa")||q.includes("faturamento")||q.includes("autoridade")||q.includes("juiz")?we="⚖️ Art. 35: Plataformas infratoras recebem multas de até 50 milhões de reais ou podem ser suspensas.":q.includes("denúncia")||q.includes("ajuda")||q.includes("apagar")||q.includes("duty of care")?we="🚨 Art. 28 e 29: Redes sociais devem apagar assédios e agressões imediatamente.":q.includes("espionagem")||q.includes("rastreador")||q.includes("stalkway")||q.includes("espiar")?we="📱 Art. 19º: Aplicativos de rastreamento devem avisar a criança e proibir espionagens ocultas.":we="📚 Dra. Beatriz: Olá! O ECA Digital protege você. Tente perguntar sobre: 'Loot boxes', 'Dados', 'Propaganda', ou 'Multas'.",be([
