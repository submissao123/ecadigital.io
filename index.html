 desenvolvida sob o princípio da Proteção Integral e do Melhor Interesse. Isso exige a adoção do 'Safety by Design' (Segurança desde a Concepção), priorizando o bem-estar psicológico e físico frente aos interesses comerciais da plataforma."}}},{id:2,chapter:"Capítulo III: Prevenção de Perigos",articles:"Artigo 6º",icon:o.jsxDEV(LV,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:40,columnNumber:13},this),color:"var(--red)",textcolor:"var(--surface)",content:{child:{title:"O Escudo Contra Perigos",desc:"A lei funciona como um escudo inteligente. Ela proíbe que aplicativos mostrem ou recomendem vídeos e imagens que ensinem a machucar a si mesmo, incentivem violência ou mostrem jogos de azar de adultos. Se algo for perigoso para sua idade, tem que ser bloqueado."},teen:{title:"Bloqueio de Conteúdos Nocivos",desc:"O algoritmo não pode mais empurrar 'lixo tóxico' para você apenas para prender sua atenção. A lei proíbe expressamente a recomendação e exibição de conteúdos que promovam automutilação, distúrbios alimentares, bullying, uso de drogas ou qualquer atividade criminosa."},adult:{title:"Dever de Mitigação de Riscos (Art. 6º)",desc:"As Big Techs possuem obrigação solidária e preventiva de bloquear a disseminação e a amplificação algorítmica de conteúdos ilícitos ou de risco, como exploração infantil, incitação a crimes e publicidade predatória, não podendo alegar desconhecimento do algoritmo."}}},{id:3,chapter:"Capítulo IV & XV: Privacidade por Padrão",articles:"Artigos 7º, 8º, 38 e 39",icon:o.jsxDEV(VV,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:53,columnNumber:13},this),color:"var(--green)",textcolor:"var(--text)",content:{child:{title:"Seus Segredos Protegidos",desc:"Nenhum aplicativo pode te 'espionar'. A lei diz que eles não podem ligar sua câmera, ver suas conversas ou saber o endereço de onde você mora sem que seus pais autorizem primeiro. As configurações de segurança mais fortes já vêm ativadas."},teen:{title:"Sua Vida Não é um Produto",desc:"Chega de ter aplicativos mapeando cada passo seu. A 'Privacidade Máxima' passa a ser o padrão obrigatório. Nenhuma empresa pode coletar secretamente sua geolocalização ou histórico para montar um perfil comportamental seu e vender essas informações."},adult:{title:"Privacy and Security by Default",desc:"As configurações mais restritivas de privacidade devem ser implementadas por padrão (Art. 7º). É absolutamente proibido coletar, processar e monetizar metadados ou geolocalização de crianças e adolescentes de forma opaca ou sem consentimento explícito dos responsáveis."}}},{id:4,chapter:"Capítulo V: Verificação de Idade",articles:"Artigos 9º a 11 e 13 a 15",icon:o.jsxDEV(rv,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:66,columnNumber:13},this),color:"var(--gray-400)",textcolor:"var(--text)",content:{child:{title:"O Porteiro Digital",desc:"Alguns lugares da internet são só para adultos. Agora, não vai mais dar para só clicar no botão dizendo 'sou maior de idade'. Haverá um porteiro inteligente verificando se o aplicativo ou jogo é realmente seguro e feito para a sua idade."},teen:{title:"Verificação Real sem Perder a Privacidade",desc:"Para impedir que adultos criem perfis falsos tentando se passar por adolescentes e conversar com você, as redes terão que verificar a idade de verdade. Mas calma: eles só vão comprovar sua faixa etária, não guardar seus documentos (via Zero-Knowledge Proof)."},adult:{title:"Aferição de Idade Idônea",desc:"A autodeclaração ('tenho mais de 18') perde a validade. As plataformas devem adotar mecanismos rigorosos e neutros de 'Age Assurance' (Garantia de Idade), garantindo a proteção de dados (não retendo documentos de identidade) para segregar espaços infantis e adultos."}}},{id:5,chapter:"Capítulo VI & VII: Supervisão e Consentimento",articles:"Artigos 12, 16, 17 e 18",icon:o.jsxDEV(hn,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:79,columnNumber:13},this),color:"var(--accent-light)",textcolor:"var(--text)",content:{child:{title:"Apoio da Família",desc:"Para compras dentro de jogos ou para acessar lugares com estranhos, você vai precisar do apoio da sua família. O aplicativo avisa o celular dos seus pais e eles podem te ajudar a escolher o que é seguro instalar e com quem você pode conversar."},teen:{title:"Controle Contra o Vício",desc:"Você deve ser o dono do seu próprio tempo. A lei exige ferramentas fáceis e acessíveis para que você possa desligar recursos viciantes, como a reprodução automática de vídeos (autoplay) e o 'scroll infinito' (rolagem de tela que nunca acaba)."},adult:{title:"Governança e Consentimento Parental",desc:"Plataformas são obrigadas a fornecer painéis de controle em linguagem acessível (português), permitindo à família gerenciar o tempo de tela do menor, aprovar contatos de terceiros e auditar as permissões de compartilhamento de dados ativas (Art. 16)."}}},{id:6,chapter:"Capítulo VI: Monitoramento vs. Espionagem",articles:"Artigo 19",icon:o.jsxDEV(ws,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:92,columnNumber:13},this),color:"var(--yellow)",textcolor:"var(--text)",content:{child:{title:"Avisos de Segurança",desc:"Mesmo que sua família ou escola usem um aplicativo para saber onde você está (para sua segurança na rua, por exemplo), o seu celular sempre te mostrará um aviso claro dizendo que você está sendo cuidado. Ninguém pode te monitorar escondido."},teen:{title:"Transparência Não é Espionagem",desc:"Ferramentas de controle parental visam sua segurança física e digital, mas a espionagem invisível (stalkerware) foi proibida. O Artigo 19 garante que você veja uma notificação constante na tela se houver softwares rastreando sua localização."},adult:{title:"Transparência no Monitoramento (Art. 19)",desc:"Software de controle parental ou corporativo que monitora a localização de menores é legal, mas é proibida a operação furtiva. O dispositivo deve manter notificação constante, clara e inteligível ao menor de que o monitoramento está ativo."}}},{id:7,chapter:"Capítulo VII & VIII: Fim do Cassino",articles:"Artigos 20 e 21",icon:o.jsxDEV(js,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:105,columnNumber:13},this),color:"var(--red-light)",textcolor:"var(--text)",content:{child:{title:"Fim das Caixas Surpresa Pagas",desc:"Sabe quando você compra uma caixa mágica no jogo e ela só te dá itens ruins repetidos? A lei proibiu as 'Loot Boxes' que custam dinheiro de verdade. Agora, se for pagar por um item, o jogo tem que mostrar exatamente o que você está comprando."},teen:{title:"Fim da Manipulação e do Pay-to-Win",desc:"Adeus aos cassinos virtuais disfarçados de joguinhos inocentes. A lei proíbe apostas em jogos infanto-juvenis, roletas para ganhar itens e o uso de 'dinheiro virtual' confuso que tenta esconder de você quanto as coisas custam de verdade em Reais (R$)."},adult:{title:"Vedação a Mecânicas de Cassino",desc:"Proibição expressa de comercialização e oferta de 'Loot Boxes' pagas, roletas, simulações de jogos de azar e outras mecânicas de monetização predatória que induzam menores a gastos impulsivos sob efeito psicológico similar a apostas."}}},{id:8,chapter:"Capítulo VIII, IX & XI: Fim da Publicidade Espiã",articles:"Artigos 22 a 26",icon:o.jsxDEV(Hc,{},void 0,!1,{fileName:"/app/applet/src/screens/Onboarding.tsx",lineNumber:118,columnNumber:13},this),color:"var(--purple)",textcolor:"#fff",content:{child:{title:"Propaganda Limpa",desc:"Os robôs da internet não podem tentar adivinhar se você está triste para te mostrar propaganda de doces, nem usar youtubers famosos para te convencer a comprar coisas perigosas escondido. Toda propaganda tem que ser honesta."},teen:{title:"Fim do Marketing Manipulador",desc:"É proibido que empresas juntem seus dados de navegação, histórico e reações para criar propagandas direcionadas que manipulam seu estado emocional ('Microtargeting'). A public
